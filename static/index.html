<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المساعد الذكي</title>
    <style>
        :root {
            --bg-color: #f5f7fb;
            --chat-bg: #ffffff;
            --text-color: #333333;
            --box-bg: #f9f9fb;
            --border-color: #eaeaea;
            --message-bot-bg: #ffffff;
            --sidebar-bg: #ffffff;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --chat-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --box-bg: #181818;
            --border-color: #2c2c2c;
            --message-bot-bg: #2d2d2d;
            --sidebar-bg: #1e1e1e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--chat-bg);
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        .chat-header {
            background-color: #4a154b;
            color: #ffffff;
            padding: 15px;
            display: flex;
            align-items: center;
            font-weight: bold;
            font-size: 1.1rem;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            z-index: 101;
        }

        .chat-header .bot-icon {
            width: 35px;
            height: 35px;
            background-color: #ffffff;
            border-radius: 50%;
            margin-left: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .settings-toggle {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            margin-right: auto;
            color: #ffffff;
            outline: none;
        }

        .sidebar {
            position: absolute;
            top: 0;
            right: -280px;
            width: 260px;
            height: 100%;
            background-color: var(--sidebar-bg);
            border-left: 1px solid var(--border-color);
            box-shadow: -5px 0 15px rgba(0,0,0,0.05);
            z-index: 200;
            transition: right 0.3s ease;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar.open {
            right: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            font-weight: bold;
        }

        .close-sidebar {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-color);
            outline: none;
        }

        .setting-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setting-btn {
            background-color: #007bff;
            color: #ffffff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .setting-btn.secondary {
            background-color: #6c757d;
        }

        .key-display {
            background-color: var(--box-bg);
            padding: 10px;
            border-radius: 5px;
            font-size: 0.8rem;
            word-break: break-all;
            border: 1px dashed var(--border-color);
            display: none;
            cursor: pointer;
            text-align: center;
        }

        .api-caret-container {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: var(--box-bg);
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            font-size: 0.85rem;
        }

        .caret-indicator {
            width: 10px;
            height: 10px;
            background-color: #6c757d;
            border-radius: 50%;
            display: inline-block;
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        .caret-indicator.active {
            background-color: #28a745;
            box-shadow: 0 0 8px #28a745;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: var(--box-bg);
            padding-bottom: 90px; 
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message.bot {
            background-color: var(--message-bot-bg);
            color: var(--text-color);
            align-self: flex-start;
            border-bottom-right-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            border: 1px solid var(--border-color);
        }

        .message.user {
            background-color: #007bff;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-left-radius: 4px;
        }

        /* تثبيت صندوق الكتابة الثابت بالأسفل حاسماً لعدم الاختفاء */
        .input-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--chat-bg);
            padding: 12px 15px;
            box-sizing: border-box;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 100;
        }

        .input-container input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            background-color: var(--box-bg);
            color: var(--text-color);
            border-radius: 25px;
            font-size: 0.95rem;
            outline: none;
        }

        .input-container button {
            background-color: #007bff;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: bold;
        }

        #pwa-install-btn {
            display: none;
            background-color: #28a745;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            margin-left: 10px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="chat-header">
            <div class="bot-icon">🤖</div>
            <span>المساعد الذكي</span>
            <button id="pwa-install-btn">تحميل</button>
            <button class="settings-toggle" onclick="toggleSidebar()">⚙️</button>
        </div>

        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span>إعدادات التطبيق</span>
                <button class="close-sidebar" onclick="toggleSidebar()">✕</button>
            </div>
            
            <div class="setting-item">
                <label>مظهر التطبيق:</label>
                <button class="setting-btn secondary" id="theme-btn" onclick="toggleTheme()">التحويل للوضع الليلي 🌙</button>
            </div>

            <div class="setting-item">
                <label>حالة المفتاح الحالي:</label>
                <div class="api-caret-container">
                    <span class="caret-indicator" id="caret-dot"></span>
                    <span id="caret-status-text">مفتاح غير نشط / مفقود</span>
                </div>
            </div>

            <div class="setting-item">
                <label>إدارة الـ API Key:</label>
                <button class="setting-btn" onclick="generateApiKey()">صنع API Key جديد 🔑</button>
                <div class="key-display" id="key-display" onclick="copyKey()">اضغط هنا لنسخ المفتاح</div>
            </div>
        </div>

        <div class="chat-messages" id="chat-box">
            <div class="message bot">
                أهلاً بك! اكتب رسالتك بالأسفل لتبدأ التحدث مع المساعد الذكي الموثق.
            </div>
        </div>

        <div class="input-container">
            <input type="text" id="user-input" placeholder="اكتب رسالتك هنا..." onkeydown="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <script>
        let ACTIVE_USER_API_KEY = "sk_assist_default_key"; 
        const BASE_SERVER_URL = "https://railway.app";

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const themeBtn = document.getElementById('theme-btn');
            if (currentTheme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                themeBtn.innerText = "التحويل للوضع الليلي 🌙";
            } else {
